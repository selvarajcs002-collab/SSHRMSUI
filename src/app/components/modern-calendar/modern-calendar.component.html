<div class="calendar-wrapper">
  <!-- Trigger Button -->
  <div class="date-display" (click)="toggleCalendar()">
    <i class="fa-regular fa-calendar"></i> {{ selectedDate | date:'EEEE, dd MMM yyyy' }}
  </div>

  <!-- Popup Calendar -->
  <div class="calendar-popup animate-fade-in" *ngIf="isOpen" (click)="$event.stopPropagation()">
    
    <div class="calendar-header">
      <button class="nav-btn" (click)="prevMonth($event)"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="month-year">{{ currentMonth | date:'MMMM yyyy' }}</div>
      <button class="nav-btn" (click)="nextMonth($event)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="calendar-grid">
      <!-- Weekdays -->
      <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
      
      <!-- Days -->
      <div class="day-cell" 
           *ngFor="let day of daysInMonth" 
           [ngClass]="{
             'other-month': !day.isCurrentMonth,
             'today': day.isToday,
             'selected': day.isSelected
           }"
           (click)="selectDate(day, $event)">
        <span class="day-num">{{ day.date.getDate() }}</span>
      </div>
    </div>
    
    <div class="calendar-footer">
      <button class="today-btn" (click)="setToday($event)">Today</button>
    </div>
  </div>
</div>
